<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>विषय सूची</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px 40px;
      background-color: #faf9f6;
      color: #1a1a1a;
      font-family: "Noto Sans Devanagari", "Nirmala UI", "Kohinoor Devanagari", sans-serif;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 20px;
      font-size: 26px;
      line-height: 1.4;
      color: #111827;
    }

    .tabs-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .tab-link {
      flex: 1 1 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 54px;
      padding: 12px 18px;
      background-color: #ffffff;
      color: #1f2937;
      text-decoration: none;
      font-size: 18px;
      font-weight: 600;
      border: 1.5px solid #d1d5db;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
      word-break: break-word;
      transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
    }

    .tab-link:hover,
    .tab-link:focus-visible {
      background-color: #eff6ff;
      border-color: #2563eb;
      color: #1d4ed8;
      outline: none;
    }

    .tab-link:active {
      transform: scale(0.97);
    }

    .empty-msg {
      padding: 16px;
      background-color: #fef3c7;
      border: 1px solid #f59e0b;
      border-radius: 10px;
      font-size: 16px;
      line-height: 1.6;
      color: #78350f;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>अध्याय चुनें</h1>
    <nav id="tabsContainer" class="tabs-bar" aria-label="HTML pages"></nav>
  </main>

  <script>
    const htmlFiles = ["constituional law.html"];
    const tabsContainer = document.getElementById("tabsContainer");

    if (htmlFiles.length === 0) {
      tabsContainer.innerHTML =
        '<div class="empty-msg">इस फ़ोल्डर में कोई HTML फ़ाइल नहीं मिली।</div>';
    } else {
      htmlFiles.forEach((file) => {
        const link = document.createElement("a");
        link.className = "tab-link";
        link.href = encodeURIComponent(file);
        link.textContent = file.replace(/\.html?$/i, "");
        tabsContainer.appendChild(link);
      });
    }
  </script>
</body>
</html>
